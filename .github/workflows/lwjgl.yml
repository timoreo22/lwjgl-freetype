# IMPORTANT: after HEAD is updated, the "LWJGL" tag must be recreated!
name: LWJGL Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master

env:
  FREETYPE_PARAMS: --wrap-mode=default --force-fallback-for=harfbuzz,libpng,zlib -Dbrotli=disabled -Dbzip2=disabled -Dharfbuzz=enabled -Dpng=enabled -Dzlib=system -Dtests=disabled -Dbuildtype=release -Dfreetype2:zlib=disabled -Dfreetype2:png=disabled -Dharfbuzz:experimental_api=true -Dharfbuzz:subset=disabled -Dharfbuzz:raster=disabled -Dharfbuzz:vector=disabled -Db_lto=true -Db_ndebug=true -Derror_strings=true

jobs:
  linux-cross:
    name: Linux Cross
    runs-on: ${{matrix.RUNNER}}
    strategy:
      fail-fast: false
      matrix:
        ARCH: [arm64, riscv64]
        include:
          - ARCH: arm64
            RUNNER: ubuntu-22.04
            CROSS_ARCH: arm64
            TRIPLET: aarch64-linux-gnu
            GCC: 12
          - ARCH: riscv64
            RUNNER: ubuntu-24.04
            CROSS_ARCH: riscv64
            TRIPLET: riscv64-linux-gnu
            GCC: 14
    env:
      LWJGL_ARCH: ${{matrix.ARCH}}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq install \
            gcc-${{matrix.GCC}}-${{matrix.TRIPLET}} \
            g++-${{matrix.GCC}}-${{matrix.TRIPLET}} \
            libc6-dev-${{matrix.CROSS_ARCH}}-cross
      - name: Install FreeType dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq install python3-pip ninja-build
          pip3 install meson
      - name: Configure build
        run: |
          export PKG_CONFIG_LIBDIR="/usr/lib/${{matrix.TRIPLET}}/pkgconfig:/usr/share/pkgconfig"
          meson setup build $FREETYPE_PARAMS --cross-file lwjgl_linux_${{matrix.ARCH}}.cross
      - name: Build
        run: |
          meson compile --verbose -C build
          ${{matrix.TRIPLET}}-strip build/libfreetype.so
      - name: Make Jar
        run : |
          mkdir -p packaging-${{matrix.ARCH}}/linux/${{matrix.ARCH}}/org/lwjgl/freetype/
          cp build/libfreetype.so packaging-${{matrix.ARCH}}/linux/${{matrix.ARCH}}/org/lwjgl/freetype/
          sha1sum build/libfreetype.so | awk '{ print $1 }' > packaging-${{matrix.ARCH}}/META-INF/linux/${{matrix.ARCH}}/org/lwjgl/freetype/libfreetype.so.sha1
          cd packaging-${{matrix.ARCH}}
          zip -r lwjgl-freetype-3.4.3-mojang-2.15.0-natives-linux-${{matrix.ARCH}}.jar .
          mv lwjgl-freetype-3.4.3-mojang-2.15.0-natives-linux-${{matrix.ARCH}}.jar ..
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lwjgl-freetype-natives-linux-${{matrix.ARCH}}.jar
          path: lwjgl-freetype-3.4.3-mojang-2.15.0-natives-linux-${{matrix.ARCH}}.jar

